name: Feature request
description: Propose a capability this project does not have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today? Describe the situation, not the solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: What you have in mind }
  - type: textarea
    id: alternatives
    attributes: { label: What you tried instead }
